{% comment %}
  Jekyll Sandbox Shortcode Include
  Parameters:
    - layout: "full" (default) or "side-by-side"
{% endcomment %}

{% assign hide_preview = "false" %}

{% if include.layout == "side-by-side" %}
  {% assign hide_preview = "true" %}
{% endif %}

<!-- React mount point -->
<div
  id="react-editor-root"
  data-hide-preview="{{ hide_preview }}">
</div>

<!-- Compiled React editor styles -->
<link
  rel="stylesheet"
  href="{{ '/assets/css/react-editor.css' | relative_url }}">

<!-- Compiled React editor -->
<script
  type="module"
  src="{{ '/assets/js/react-editor.js' | relative_url }}">
</script>
